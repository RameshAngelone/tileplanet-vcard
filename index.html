<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tile Planet Digital Card</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

.container{
max-width:430px;
margin:auto;
background:#000;
min-height:100vh;
}

.hero{
position:relative;
background:url('showroom.jpg') center center/cover;
padding:20px;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.72);
}

.hero-content{
position:relative;
z-index:2;
}

.logo{
width:180px;
display:block;
margin:auto;
}

.tagline{
text-align:center;
font-size:14px;
letter-spacing:2px;
margin-top:8px;
color:#ddd;
}

.main-card{
margin-top:20px;
padding:18px;
border-radius:28px;

background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 8px 32px rgba(0,0,0,.45);
}

.top-row{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
}

.name-box{
flex:1;
}

.name{
font-size:30px;
font-weight:700;
line-height:1.1;
}

.designation{
color:#ff5d5d;
margin-top:8px;
font-size:15px;
}

.contact-btn{
display:flex;
align-items:center;
gap:10px;

margin-top:18px;
padding:15px;

border-radius:20px;

background:rgba(255,0,0,.18);

border:1px solid rgba(255,0,0,.4);

text-decoration:none;
color:#fff;
font-size:18px;
font-weight:700;
}

.contact-btn:hover{
transform:scale(1.02);
}

.qr-box{
width:120px;
text-align:center;
}

.qr-box img{
width:100%;
border-radius:18px;
background:#fff;
padding:8px;
}

.qr-title{
margin-top:8px;
font-size:13px;
}

.quick-actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:20px;
}

.glass-btn{
text-decoration:none;
color:#fff;

padding:14px 8px;
border-radius:18px;

text-align:center;

background:rgba(255,255,255,.06);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.12);

font-size:13px;
font-weight:600;
}

.glass-btn:hover{
background:rgba(255,255,255,.15);
}

.section-title{
text-align:center;
font-size:16px;
font-weight:700;
color:#ff7070;
margin:22px 0 14px;
letter-spacing:1px;
}

.product-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
padding:0 10px;
}

.product{
text-align:center;
}

.product img{
width:100%;
height:72px;
object-fit:cover;
border-radius:18px;
}

.product span{
display:block;
margin-top:6px;
font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">

<div class="hero-content">

<img src="Logo.png" class="logo">

<div class="tagline">
PREMIUM TILES • PERFECT SPACES
</div>

<div class="main-card">

<div class="top-row">

<div class="name-box">

<div class="name">
Ramesh Chotalia
</div>

<div class="designation">
PROPRIETOR
</div>

<a href="tel:+919922533033" class="contact-btn">
📞 +91 9922533033
</a>

</div>

<div class="qr-box">

<img src="contactqr.jpg">

<div class="qr-title">
SAVE CONTACT
</div>

</div>

</div>

<div class="quick-actions">

<a href="tel:+919922533033" class="glass-btn">
📞<br>CALL
</a>

<a href="https://wa.me/919922533033" class="glass-btn">
💬<br>CHAT
</a>

<a href="mailto:ramesh.chotalia13@gmail.com" class="glass-btn">
✉️<br>EMAIL
</a>

<a href="https://maps.google.com" class="glass-btn">
📍<br>MAP
</a>

</div>

</div>

</div>

</div>

<div class="section-title">
OUR PRODUCTS
</div>

<div class="product">
