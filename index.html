<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile Planet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

.container{
max-width:420px;
margin:auto;
background:#0a0a0a;
min-height:100vh;
}

.hero{
background:url('showroom.jpg');
background-size:cover;
background-position:center;
padding:15px;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.65);
}

.hero-content{
position:relative;
z-index:2;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.topbtn{
padding:10px 14px;
}

.profile{
display:flex;
gap:10px;
align-items:center;
padding:12px;
}

.logo{
width:120px;
}

.qr{
width:110px;
border-radius:12px;
}

.name{
font-size:22px;
font-weight:bold;
}

.role{
color:#ff4040;
margin-top:4px;
}

.phone{
margin-top:10px;
padding:12px;
background:#550000;
border-radius:15px;
font-weight:bold;
}

.actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:10px;
}

.action{
padding:10px;
text-align:center;
font-size:12px;
}

.section{
padding:10px;
}

.title{
text-align:center;
margin:12px 0;
color:#ff4040;
}

.products{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.product{
text-align:center;
font-size:10px;
overflow:hidden;
}

.product img{
width:100%;
height:55px;
object-fit:cover;
display:block;
}

.row2{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px;
}

.box{
padding:10px;
}

.box img{
width:100%;
border-radius:12px;
}

.paybtn{
display:block;
padding:12px;
text-align:center;
background:#ff4040;
border-radius:15px;
color:#fff;
text-decoration:none;
margin-top:10px;
}

.footer{
padding:15px;
text-align:center;
font-size:12px;
opacity:.8;
}

a{
color:white;
text-decoration:none;
}

</style>
</head>
