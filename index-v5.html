<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tile Planet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#050505;
color:white;
}

.container{
max-width:430px;
margin:auto;
padding:12px;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
}

.hero{

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.75)
),

url('showroom.jpg');

background-size:cover;
background-position:center;

padding:18px;

border-radius:28px;

overflow:hidden;

box-shadow:
0 10px 40px rgba(255,0,0,.15);

}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.menuBtn,
.shareBtn{

width:45px;
height:45px;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;

border-radius:50%;
}

.logo{
width:180px;
display:block;
margin:auto;
}

.tagline{

text-align:center;

font-size:13px;

margin-top:8px;

letter-spacing:1px;

color:#ddd;

}

.heroRow{

display:flex;

justify-content:space-between;

gap:10px;

margin-top:20px;

}

.leftInfo{
flex:1;
}

.name{

font-size:32px;

font-weight:700;

margin-top:10px;

}

.role{

color:#ff4040;

font-size:14px;

margin-top:4px;

}

.callBox{

margin-top:15px;

padding:14px;

border-radius:18px;

background:rgba(255,0,0,.18);

border:1px solid rgba(255,0,0,.35);

}

.callBox a{

color:white;

text-decoration:none;

font-size:22px;

font-weight:bold;

}

.qrCard{

width:130px;

padding:10px;

text-align:center;

}

.qrCard img{

width:100%;

border-radius:12px;

}

.qrText{

font-size:11px;

margin-top:8px;

}

.quickActions{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin-top:12px;

}

.action{

padding:12px;

text-align:center;

font-size:12px;

text-decoration:none;

color:white;

}

.sectionTitle{

text-align:center;

margin:18px 0 10px;

font-size:18px;

font-weight:bold;

color:#ff4040;

}

</style>

</head>
